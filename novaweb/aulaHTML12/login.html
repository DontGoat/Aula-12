<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header>
        <h1>Área do Aluno</h1>
        <p>Entre com seu e-mail e senha</p>
    </header>

    <main>
        <!-- method="post" envia os dados sem mostrar na URL -->
        <form id="formLogin" class="caixa" action="#" method="post" onsubmit="return validarLogin()">
            <h2>Login</h2>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

            <p id="mensagem" class="mensagem"></p>

            <input type="submit" value="Entrar">

            <div class="links">
                <a href="#">Criar cadastro</a>
                <a href="#">Esqueci minha senha</a>
            </div>
        </form>
    </main>

    <footer>
        <p>Pedro Henrique de Sousa Martins - DSM</p>
    </footer>

    <script src="login.js"></script>
</body>
</html>
